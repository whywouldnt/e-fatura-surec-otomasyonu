<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Altyapı: Linux sanal sunucuda her işletme için ayrı Docker konteyneri">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#162036"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .beat { animation: beat 2s ease-in-out infinite; }
      @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
      .flow { stroke-dasharray: 5 7; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>

  <text x="40" y="52" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">ALTYAPI</text>
  <text x="40" y="80" font-size="22" font-weight="800" fill="#f8fafc">Her işletmeye kendi botu, kendi verisi.</text>

  <!-- Telegram -->
  <g>
    <rect x="40" y="130" width="170" height="150" rx="16" fill="#111a2c" stroke="#2aabee" stroke-opacity="0.6"/>
    <circle cx="125" cy="180" r="26" fill="#2aabee"/>
    <path d="M 112 180 L 138 168 L 132 194 L 125 187 L 133 175 L 121 185 Z" fill="#fff"/>
    <text x="125" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Telegram</text>
    <text x="125" y="254" text-anchor="middle" font-size="12" fill="#94a3b8">işletme başına ayrı bot</text>
  </g>

  <!-- Sunucu -->
  <rect x="270" y="110" width="640" height="210" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="292" y="138" font-size="12" font-weight="800" fill="#94a3b8" letter-spacing="1.4">LİNUX SANAL SUNUCU · UBUNTU 24.04</text>
  <circle cx="888" cy="133" r="5" fill="#22c55e" class="beat"/>

  <g>
    <rect x="292" y="156" width="190" height="140" rx="12" fill="#111a2c" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="310" y="182" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="1.2">🐳 İŞLETME A</text>
    <text x="310" y="208" font-size="12" fill="#cbd5e1">ayrı .env · ayrı data/</text>
    <text x="310" y="228" font-size="12" fill="#cbd5e1">heartbeat + healthcheck</text>
    <text x="310" y="248" font-size="12" fill="#cbd5e1">günlük döner yedek</text>
    <text x="310" y="276" font-size="11" fill="#22c55e" class="mono">● healthy</text>
  </g>
  <g>
    <rect x="496" y="156" width="190" height="140" rx="12" fill="#111a2c" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="514" y="182" font-size="11" font-weight="800" fill="#f59e0b" letter-spacing="1.2">🐳 İŞLETME B</text>
    <text x="514" y="208" font-size="12" fill="#cbd5e1">tek komutla kurulum</text>
    <text x="514" y="228" font-size="12" fill="#cbd5e1">güvenli varsayılanlar</text>
    <text x="514" y="248" font-size="12" fill="#cbd5e1">(DRY_RUN + taslak)</text>
    <text x="514" y="276" font-size="11" fill="#22c55e" class="mono">● healthy</text>
  </g>
  <g>
    <rect x="700" y="156" width="190" height="140" rx="12" fill="none" stroke="#475569" stroke-dasharray="6 6"/>
    <text x="795" y="214" text-anchor="middle" font-size="26" fill="#475569">＋</text>
    <text x="795" y="246" text-anchor="middle" font-size="12" fill="#64748b" class="mono">yeni_musteri.sh</text>
    <text x="795" y="266" text-anchor="middle" font-size="12" fill="#64748b">sonraki işletme</text>
  </g>

  <!-- Veriban -->
  <g>
    <rect x="970" y="130" width="190" height="150" rx="16" fill="#111a2c" stroke="#f472b6" stroke-opacity="0.6"/>
    <text x="1065" y="186" text-anchor="middle" font-size="28">🧾</text>
    <text x="1065" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">Veriban</text>
    <text x="1065" y="254" text-anchor="middle" font-size="12" fill="#94a3b8">e-Fatura · e-Arşiv SOAP</text>
  </g>

  <g stroke-width="2.5" fill="none">
    <line class="flow" x1="212" y1="205" x2="268" y2="205" stroke="#2aabee"/>
    <line class="flow" x1="912" y1="205" x2="968" y2="205" stroke="#f472b6"/>
  </g>

  <text x="600" y="346" text-anchor="middle" font-size="12" fill="#64748b">fail2ban · otomatik güvenlik güncellemeleri · hata olunca yöneticiye Telegram uyarısı · ~4 $/ay altyapı</text>
</svg>
