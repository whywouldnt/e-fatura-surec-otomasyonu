<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="İşlem hattı: girdi, yapay zeka ayrıştırma, deterministik hesap, insan onayı, Veriban SOAP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#162036"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .t { font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .s { font-size: 12px; fill: #94a3b8; }
      .n { font-size: 11px; font-weight: 800; letter-spacing: 1.5px; }
      .flow { stroke-dasharray: 5 7; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
    </style>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/>

  <text x="40" y="52" font-size="13" font-weight="700" fill="#64748b" letter-spacing="2">İŞLEM HATTI</text>
  <text x="40" y="80" font-size="22" font-weight="800" fill="#f8fafc">Yapay zeka okur, kod hesaplar, insan onaylar.</text>

  <!-- Kartlar: x = 40, 268, 496, 724, 952 ; genişlik 208 -->
  <g>
    <rect x="40" y="112" width="208" height="176" rx="16" fill="#111a2c" stroke="#2aabee" stroke-opacity="0.55"/>
    <text x="58" y="140" class="n" fill="#2aabee">01 · GİRDİ</text>
    <text x="58" y="176" font-size="28">📷 ✍️</text>
    <text x="58" y="210" class="t">Fotoğraf veya metin</text>
    <text x="58" y="234" class="s">Çetele defteri, adisyon,</text>
    <text x="58" y="252" class="s">serbest yazılmış mesaj</text>
    <text x="58" y="270" class="s">— Telegram'dan</text>
  </g>
  <g>
    <rect x="268" y="112" width="208" height="176" rx="16" fill="#111a2c" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="286" y="140" class="n" fill="#a78bfa">02 · AYRIŞTIRMA</text>
    <text x="286" y="176" font-size="28">🧠</text>
    <text x="286" y="210" class="t">Çok modlu LLM</text>
    <text x="286" y="234" class="s">Gemini / MiMo, yedek</text>
    <text x="286" y="252" class="s">modelle; şemaya bağlı</text>
    <text x="286" y="270" class="s">yapılandırılmış JSON</text>
  </g>
  <g>
    <rect x="496" y="112" width="208" height="176" rx="16" fill="#111a2c" stroke="#f59e0b" stroke-opacity="0.6"/>
    <text x="514" y="140" class="n" fill="#f59e0b">03 · HESAP</text>
    <text x="514" y="176" font-size="28">🧮</text>
    <text x="514" y="210" class="t">Deterministik çekirdek</text>
    <text x="514" y="234" class="s">Esnaf rehberi eşleştirme,</text>
    <text x="514" y="252" class="s">ürün KDV tablosu, Decimal</text>
    <text x="514" y="270" class="s">ROUND_HALF_UP</text>
  </g>
  <g>
    <rect x="724" y="112" width="208" height="176" rx="16" fill="#111a2c" stroke="#22c55e" stroke-opacity="0.55"/>
    <text x="742" y="140" class="n" fill="#22c55e">04 · ONAY</text>
    <text x="742" y="176" font-size="28">👆</text>
    <text x="742" y="210" class="t">İnsan son sözü söyler</text>
    <text x="742" y="234" class="s">Taslak kartı: alıcı, kalem,</text>
    <text x="742" y="252" class="s">KDV, toplam · tek dokunuş,</text>
    <text x="742" y="270" class="s">çift tık kilidi</text>
  </g>
  <g>
    <rect x="952" y="112" width="208" height="176" rx="16" fill="#111a2c" stroke="#f472b6" stroke-opacity="0.55"/>
    <text x="970" y="140" class="n" fill="#f472b6">05 · KESİM</text>
    <text x="970" y="176" font-size="28">🧾</text>
    <text x="970" y="210" class="t">Veriban SOAP</text>
    <text x="970" y="234" class="s">UBL-TR 2.1 XML, ZIP+MD5,</text>
    <text x="970" y="252" class="s">kuyruk takibi → PDF +</text>
    <text x="970" y="270" class="s">muhasebe icmali (CSV)</text>
  </g>

  <!-- oklar -->
  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#ar)">
    <line class="flow" x1="250" y1="200" x2="264" y2="200"/>
    <line class="flow" x1="478" y1="200" x2="492" y2="200"/>
    <line class="flow" x1="706" y1="200" x2="720" y2="200"/>
    <line class="flow" x1="934" y1="200" x2="948" y2="200"/>
  </g>

  <!-- güvenlik ağı -->
  <rect x="40" y="312" width="1120" height="56" rx="14" fill="#0f172a" stroke="#334155" stroke-dasharray="6 6"/>
  <text x="62" y="345" font-size="13" font-weight="800" fill="#fbbf24" letter-spacing="1.2">🛡  GÜVENLİK AĞI</text>
  <text x="230" y="345" font-size="13" fill="#cbd5e1">yetkili kullanıcı listesi  ·  taslak modu  ·  DRY_RUN  ·  belirsiz yanıtta PENDING (asla çift kesim)  ·  müteselsil numara koruması</text>
</svg>
