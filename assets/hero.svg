<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Defterden faturaya, tek mesajla — e-Fatura Süreç Otomasyonu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.1" r="0.45">
      <stop offset="0" stop-color="#2aabee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2aabee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="frame"><rect width="1280" height="440" rx="28"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .hand { font-family: 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive; }
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .flow { stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .pulse { transform-origin: 1196px 128px; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .blink { animation: blink 1.1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#dots)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
    <rect width="1280" height="440" fill="url(#glow2)"/>

    <!-- Sol: başlık -->
    <g class="sans">
      <rect x="64" y="70" width="318" height="32" rx="16" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-opacity="0.45"/>
      <text x="223" y="91" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="1.6" fill="#fbbf24">TELEGRAM  →  YAPAY ZEKA  →  VERİBAN</text>

      <text x="64" y="170" font-size="54" font-weight="800" fill="#f8fafc" letter-spacing="-1">Defterden faturaya,</text>
      <text x="64" y="232" font-size="54" font-weight="800" fill="#fbbf24" letter-spacing="-1">tek mesajla.<tspan class="blink" fill="#fbbf24" font-weight="300">|</tspan></text>

      <text x="64" y="282" font-size="19" fill="#cbd5e1">El yazısı çetele fotoğrafını ya da serbest metni okur, KDV'yi kuruşu</text>
      <text x="64" y="308" font-size="19" fill="#cbd5e1">kuruşuna hesaplar, tek onayla resmi e-Fatura / e-Arşiv olarak keser.</text>

      <g font-size="13" font-weight="600">
        <rect x="64" y="342" width="132" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="130" y="362" text-anchor="middle" fill="#e2e8f0">UBL-TR 2.1</text>
        <rect x="206" y="342" width="132" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="272" y="362" text-anchor="middle" fill="#e2e8f0">Veriban SOAP</text>
        <rect x="348" y="342" width="132" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="414" y="362" text-anchor="middle" fill="#e2e8f0">Decimal KDV</text>
        <rect x="490" y="342" width="132" height="30" rx="8" fill="#1e293b" stroke="#334155"/>
        <text x="556" y="362" text-anchor="middle" fill="#e2e8f0">7/24 Docker</text>
      </g>
    </g>

    <!-- Akış çizgileri -->
    <path class="flow" d="M 912 222 C 940 222, 948 222, 966 222" stroke="#2aabee" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path class="flow" d="M 1028 222 C 1040 222, 1046 222, 1058 222" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Defter -->
    <g class="float">
      <g transform="rotate(-6 815 222)" filter="url(#shadow)">
        <rect x="712" y="92" width="200" height="262" rx="10" fill="#fdf6e3"/>
        <rect x="712" y="92" width="200" height="30" rx="10" fill="#b45309"/>
        <rect x="712" y="110" width="200" height="12" fill="#b45309"/>
        <g stroke="#e8d5a8" stroke-width="1">
          <line x1="722" y1="158" x2="902" y2="158"/>
          <line x1="722" y1="190" x2="902" y2="190"/>
          <line x1="722" y1="222" x2="902" y2="222"/>
          <line x1="722" y1="254" x2="902" y2="254"/>
          <line x1="722" y1="286" x2="902" y2="286"/>
          <line x1="722" y1="318" x2="902" y2="318"/>
        </g>
        <line x1="748" y1="126" x2="748" y2="346" stroke="#f87171" stroke-opacity="0.55"/>
        <g class="hand" fill="#1e3a8a" font-size="15">
          <text x="756" y="153">Yıldız 1200 ekmek</text>
          <text x="756" y="185">Çınar 400 simit</text>
          <text x="756" y="217">Lale 250 poğaça</text>
          <text x="756" y="249">Ada 600 ekmek</text>
          <text x="756" y="281" fill="#b91c1c">Kasım ✓</text>
        </g>
        <text x="812" y="112" text-anchor="middle" class="sans" font-size="12" font-weight="700" fill="#fff7ed" letter-spacing="2">ÇETELE</text>
      </g>
    </g>

    <!-- Bot -->
    <g filter="url(#shadow)">
      <circle cx="997" cy="222" r="31" fill="#2aabee"/>
      <path d="M 982 222 L 1013 208 L 1006 238 L 997 229 L 1007 214 L 993 226 Z" fill="#ffffff"/>
    </g>

    <!-- Fatura -->
    <g filter="url(#shadow)" class="sans">
      <rect x="1060" y="104" width="182" height="236" rx="12" fill="#ffffff"/>
      <rect x="1060" y="104" width="182" height="44" rx="12" fill="#f59e0b"/>
      <rect x="1060" y="132" width="182" height="16" fill="#f59e0b"/>
      <text x="1076" y="133" font-size="15" font-weight="800" fill="#1f2937" letter-spacing="1">e-FATURA</text>
      <text x="1076" y="172" font-size="11" fill="#64748b">Tarih</text>
      <text x="1226" y="172" text-anchor="end" font-size="11" font-weight="600" fill="#0f172a" class="mono">30.11.2026</text>
      <line x1="1076" y1="184" x2="1226" y2="184" stroke="#e2e8f0"/>
      <text x="1076" y="204" font-size="11" fill="#334155">1.200 × Ekmek</text>
      <text x="1226" y="204" text-anchor="end" font-size="11" fill="#334155" class="mono">10.200,00</text>
      <text x="1076" y="224" font-size="11" fill="#334155">KDV %1</text>
      <text x="1226" y="224" text-anchor="end" font-size="11" fill="#334155" class="mono">102,00</text>
      <line x1="1076" y1="240" x2="1226" y2="240" stroke="#e2e8f0"/>
      <text x="1076" y="264" font-size="12" font-weight="700" fill="#0f172a">TOPLAM</text>
      <text x="1226" y="264" text-anchor="end" font-size="13" font-weight="800" fill="#0f172a" class="mono">10.302,00 ₺</text>
      <rect x="1076" y="284" width="150" height="34" rx="8" fill="#ecfdf5"/>
      <text x="1151" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#047857">UBL-TR 2.1 · GİB uyumlu</text>
    </g>
    <g class="pulse">
      <circle cx="1196" cy="128" r="22" fill="#22c55e" stroke="#0b1220" stroke-width="4"/>
      <path d="M 1185 128 L 1193 136 L 1208 120" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
